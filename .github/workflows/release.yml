name: Build and release Windows application

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Check, publish and verify application
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { '1.0.0' }
          ./scripts/build.ps1 -Version $version
      - name: Upload downloadable package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: BuckCalculator-windows-x64
          if-no-files-found: error
          path: |
            artifacts/BuckCalculator-v*-win-x64.exe
            artifacts/BuckCalculator-v*-win-x64.zip
            artifacts/SHA256SUMS.txt
      - name: Upload application verification
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: application-verification
          if-no-files-found: ignore
          path: artifacts/smoke-test/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: BuckCalculator-windows-x64
          path: release
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release -File | ForEach-Object { $_.FullName })
          gh release view $env:RELEASE_TAG *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --verify-tag --title "BUCK 计算器 $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
