name: Build and release Windows application

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned WiX toolset
        shell: pwsh
        run: dotnet tool install --global wix --version 6.0.2
      - name: Check, publish and verify application
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { '1.2.0' }
          ./scripts/build.ps1 -Version $version -VerifyInstall
      - name: Verify upgrade from the official 1.1.1 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { '1.2.0' }
          $artifacts = Join-Path $env:GITHUB_WORKSPACE 'artifacts'
          $verification = Join-Path $artifacts 'installer-test'
          $fixtureEvidence = Join-Path $artifacts 'fixture-upgrade-verification'
          $officialEvidence = Join-Path $artifacts 'official-upgrade-verification'
          New-Item -ItemType Directory -Path $fixtureEvidence, $officialEvidence -Force | Out-Null
          Get-ChildItem -LiteralPath $verification -Force | Copy-Item -Destination $fixtureEvidence -Recurse
          $fixtureResults = Get-Content -LiteralPath (Join-Path $fixtureEvidence 'installer-results.txt')
          if ($fixtureResults -match '^(SKIPPED|FAIL|PENDING):' -or
              @($fixtureResults | Where-Object { $_ -like 'PASS:*' }).Count -lt 8) {
            throw 'The generated previous-version fixture did not complete all installation checks.'
          }
          $previousDirectory = Join-Path $artifacts 'official-previous'
          New-Item -ItemType Directory -Path $previousDirectory -Force | Out-Null
          gh release download v1.1.1 --pattern 'BuckCalculator-v1.1.1-win-x64.msi' --dir $previousDirectory
          if ($LASTEXITCODE -ne 0) { throw 'The official 1.1.1 installer could not be downloaded.' }
          $previousMsi = Join-Path $previousDirectory 'BuckCalculator-v1.1.1-win-x64.msi'
          $previousHash = (Get-FileHash -LiteralPath $previousMsi -Algorithm SHA256).Hash
          if ($previousHash -ne 'A2DC35BDC8CE3888583F7E3563D38534245894A43F0858BDECA3D68FC5AE9B16') {
            throw 'The official 1.1.1 installer differs from its pinned SHA-256.'
          }
          Set-Content -LiteralPath (Join-Path $officialEvidence 'previous-installer-sha256.txt') -Value $previousHash
          try {
            ./installer/Verify-Install.ps1 -MsiPath (Join-Path $artifacts "BuckCalculator-v$version-win-x64.msi") `
              -PreviousMsiPath $previousMsi -UpdateHelperPath (Join-Path $artifacts 'publish/BuckCalculator.exe')
          } finally {
            Get-ChildItem -LiteralPath $verification -Force | Copy-Item -Destination $officialEvidence -Recurse
          }
          $officialResults = Get-Content -LiteralPath (Join-Path $officialEvidence 'installer-results.txt')
          if ($officialResults -match '^(SKIPPED|FAIL|PENDING):' -or
              @($officialResults | Where-Object { $_ -like 'PASS:*' }).Count -lt 8) {
            throw 'Upgrade from the official 1.1.1 installer did not complete all installation checks.'
          }
      - name: Upload downloadable package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: BuckCalculator-windows-x64
          if-no-files-found: error
          path: |
            artifacts/BuckCalculator-v*-win-x64.msi
            artifacts/SHA256SUMS.txt
            artifacts/update.json
      - name: Upload application verification
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: application-verification
          if-no-files-found: ignore
          path: |
            artifacts/smoke-test/
            artifacts/installer-test/
            artifacts/fixture-upgrade-verification/
            artifacts/official-upgrade-verification/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: BuckCalculator-windows-x64
          path: release
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath release -File | ForEach-Object { $_.FullName })
          gh release view $env:RELEASE_TAG *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --verify-tag --title "BUCK / BOOST 计算器 $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
